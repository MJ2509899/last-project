name: ci-production
on:
  push:
    branches:
      - production

jobs:
  ci-production-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Lint HTML and CSS
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"

      - name: Build Artifact
        run: npm run build

      - name: Upload Artifact (optional)
        uses: actions/upload-artifact@v3
        with:
          name: production-artifact
          path: ./dist
